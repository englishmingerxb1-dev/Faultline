name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # same signing key every build, so new versions install over old ones
      - name: Use fixed signing key
        run: mkdir -p ~/.android && base64 -d debug.keystore.b64 > ~/.android/debug.keystore

      - name: Create Flutter project and drop in app source
        run: |
          flutter create --org com.faultline --project-name faultline_app --platforms android app
          cp main.dart app/lib/main.dart
          rm -f app/test/widget_test.dart
          cd app
          flutter pub add webview_flutter shared_preferences wakelock_plus
          python3 ../patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk FaultLine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaultLine
          path: FaultLine.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FaultLine build ${{ github.run_number }}
          files: FaultLine.apk
          make_latest: true
